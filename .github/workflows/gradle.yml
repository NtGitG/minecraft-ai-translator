name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build with Gradle
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Configure Gradle Java home
        shell: pwsh
        run: |
          $javaHome = $env:JAVA_HOME -replace '\\', '/'
          (Get-Content gradle.properties) -replace '^org\.gradle\.java\.home=.*$', "org.gradle.java.home=$javaHome" | Set-Content gradle.properties

      - name: Build
        run: .\gradlew.bat clean build --no-daemon --console plain
